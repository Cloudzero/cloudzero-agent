suite: test aggregator resources fallback logic
templates:
  - templates/aggregator-deploy.yaml
tests:
  # Test that aggregator.collector.resources takes precedence over components.aggregator.collector.resources
  - it: should use aggregator.collector.resources when both are set
    set:
      components.aggregator.collector.resources:
        requests:
          memory: "128Mi"
          cpu: "200m"
        limits:
          memory: "2048Mi"
          cpu: "4000m"
      aggregator.collector.resources:
        requests:
          memory: "64Mi"
          cpu: "100m"
        limits:
          memory: "1024Mi"
          cpu: "2000m"
    asserts:
      - equal:
          path: spec.template.spec.containers[0].resources.requests.memory
          value: "64Mi"
      - equal:
          path: spec.template.spec.containers[0].resources.requests.cpu
          value: "100m"
      - equal:
          path: spec.template.spec.containers[0].resources.limits.memory
          value: "1024Mi"
      - equal:
          path: spec.template.spec.containers[0].resources.limits.cpu
          value: "2000m"

  # Test that aggregator.collector.resources is used when components.aggregator.collector.resources is not set
  - it: should use aggregator.collector.resources when components.aggregator.collector.resources is not set
    set:
      aggregator.collector.resources:
        requests:
          memory: "64Mi"
          cpu: "100m"
        limits:
          memory: "1024Mi"
          cpu: "2000m"
    asserts:
      - equal:
          path: spec.template.spec.containers[0].resources.requests.memory
          value: "64Mi"
      - equal:
          path: spec.template.spec.containers[0].resources.requests.cpu
          value: "100m"
      - equal:
          path: spec.template.spec.containers[0].resources.limits.memory
          value: "1024Mi"
      - equal:
          path: spec.template.spec.containers[0].resources.limits.cpu
          value: "2000m"

  # Test that components.aggregator.collector.resources is used when aggregator.collector.resources is not set
  - it: should use components.aggregator.collector.resources when aggregator.collector.resources is not set
    set:
      components.aggregator.collector.resources:
        requests:
          memory: "128Mi"
          cpu: "200m"
        limits:
          memory: "2048Mi"
          cpu: "4000m"
      aggregator.collector.resources:
        requests:
          memory: ""
          cpu: ""
        limits:
          memory: ""
          cpu: ""
    asserts:
      - equal:
          path: spec.template.spec.containers[0].resources.requests.memory
          value: "128Mi"
      - equal:
          path: spec.template.spec.containers[0].resources.requests.cpu
          value: "200m"
      - equal:
          path: spec.template.spec.containers[0].resources.limits.memory
          value: "2048Mi"
      - equal:
          path: spec.template.spec.containers[0].resources.limits.cpu
          value: "4000m"

  - it: should render ephemeral-storage requests and limits
    set:
      components.aggregator.collector.resources:
        requests:
          ephemeral-storage: "1Gi"
        limits:
          ephemeral-storage: "2Gi"
    asserts:
      - equal:
          path: spec.template.spec.containers[0].resources.requests.ephemeral-storage
          value: "1Gi"
      - equal:
          path: spec.template.spec.containers[0].resources.limits.ephemeral-storage
          value: "2Gi"

  - it: should request the emptyDir sizeLimit as collector ephemeral-storage
    set:
      aggregator.database.emptyDir.sizeLimit: "5Gi"
    asserts:
      - equal:
          path: spec.template.spec.containers[0].resources.requests.ephemeral-storage
          value: "5Gi"
      - notExists:
          path: spec.template.spec.containers[0].resources.limits.ephemeral-storage
      - notExists:
          path: spec.template.spec.containers[1].resources.requests.ephemeral-storage

  - it: should prefer an explicit collector ephemeral-storage request over the sizeLimit
    set:
      aggregator.database.emptyDir.sizeLimit: "5Gi"
      components.aggregator.collector.resources:
        requests:
          ephemeral-storage: "1Gi"
    asserts:
      - equal:
          path: spec.template.spec.containers[0].resources.requests.ephemeral-storage
          value: "1Gi"

  - it: should not request ephemeral-storage when no sizeLimit is set
    asserts:
      - notExists:
          path: spec.template.spec.containers[0].resources.requests.ephemeral-storage

  - it: should not request ephemeral-storage when the emptyDir is disabled
    set:
      aggregator.database.emptyDir.enabled: false
      aggregator.database.emptyDir.sizeLimit: "5Gi"
    asserts:
      - notExists:
          path: spec.template.spec.containers[0].resources.requests.ephemeral-storage
