suite: test Alloy deployment configuration
templates:
  - templates/agent-deploy.yaml
  - templates/agent-cm.yaml
tests:
  # Test that Prometheus is deployed by default (Alloy disabled)
  - it: should deploy Prometheus container when Alloy is not enabled
    asserts:
      - equal:
          path: spec.template.spec.containers[1].name
          value: cloudzero-agent-server
        template: templates/agent-deploy.yaml
      - matchRegex:
          path: spec.template.spec.containers[1].image
          pattern: prometheus
        template: templates/agent-deploy.yaml
      - isNotEmpty:
          path: data["prometheus.yml"]
        template: templates/agent-cm.yaml
      - isNull:
          path: data["alloy-config.river"]
        template: templates/agent-cm.yaml

  # Test that Alloy is deployed when enabled
  - it: should deploy Alloy container when components.agent.mode is clustered
    set:
      components.agent.mode: clustered
    asserts:
      - equal:
          path: spec.template.spec.containers[1].name
          value: cloudzero-agent-alloy
        template: templates/agent-deploy.yaml
      - matchRegex:
          path: spec.template.spec.containers[1].image
          pattern: cloudzero-agent
        template: templates/agent-deploy.yaml
      - isNull:
          path: data["prometheus.yml"]
        template: templates/agent-cm.yaml
      - isNotEmpty:
          path: data["alloy-config.river"]
        template: templates/agent-cm.yaml

  # Test that ConfigMap reloader is deployed with Alloy
  - it: should deploy ConfigMap reloader sidecar when using Alloy
    set:
      components.agent.mode: clustered
      configmapReload.prometheus.enabled: true
    asserts:
      - lengthEqual:
          path: spec.template.spec.containers
          count: 2
        template: templates/agent-deploy.yaml
      - equal:
          path: spec.template.spec.containers[0].name
          value: cloudzero-agent-server-configmap-reload
        template: templates/agent-deploy.yaml
      - equal:
          path: spec.template.spec.containers[1].name
          value: cloudzero-agent-alloy
        template: templates/agent-deploy.yaml

  # Test that ConfigMap reloader IS deployed with Prometheus
  - it: should deploy ConfigMap reloader sidecar when using Prometheus
    set:
      components.agent.mode: agent
      configmapReload.prometheus.enabled: true
    asserts:
      - lengthEqual:
          path: spec.template.spec.containers
          count: 2
        template: templates/agent-deploy.yaml
      - equal:
          path: spec.template.spec.containers[0].name
          value: cloudzero-agent-server-configmap-reload
        template: templates/agent-deploy.yaml
      - equal:
          path: spec.template.spec.containers[1].name
          value: cloudzero-agent-server
        template: templates/agent-deploy.yaml

  # Test Alloy container configuration
  - it: should configure Alloy container correctly
    set:
      components.agent.mode: clustered
    asserts:
      - contains:
          path: spec.template.spec.containers[1].command
          content: /app/cloudzero-alloy
        template: templates/agent-deploy.yaml
      - contains:
          path: spec.template.spec.containers[1].args
          content: run
        template: templates/agent-deploy.yaml
      - contains:
          path: spec.template.spec.containers[1].args
          content: /etc/alloy/alloy-config.river
        template: templates/agent-deploy.yaml
      - contains:
          path: spec.template.spec.containers[1].args
          content: --server.http.listen-addr=0.0.0.0:9090
        template: templates/agent-deploy.yaml
      - equal:
          path: spec.template.spec.containers[1].ports[0].containerPort
          value: 9090
        template: templates/agent-deploy.yaml

  # Test Alloy clustering mode
  #
  # Clustering must be enabled whenever Alloy runs. The River config emits
  # `clustering { enabled = true }` on every pipeline, but that block is inert
  # unless the process is also started with --cluster.enabled, and the replicas
  # can only shard work between them if they can discover each other. Without
  # both, every replica forms a single-member ring, owns 100% of targets, and
  # duplicates the entire cluster's collection and remote_write.
  - it: should enable Alloy clustering with peer discovery
    set:
      components.agent.mode: clustered
      clusterName: test-cluster
    asserts:
      - contains:
          path: spec.template.spec.containers[1].args
          content: --cluster.enabled=true
        template: templates/agent-deploy.yaml
      - contains:
          path: spec.template.spec.containers[1].args
          content: --cluster.name=RELEASE-NAME-cz-server
        template: templates/agent-deploy.yaml
      # Peer discovery. Alloy gossips over its HTTP listen port (the cluster
      # service is constructed with ListenAddress = --server.http.listen-addr),
      # so this resolves to the headless service on 9090. A bare DNS name is
      # resolved via the dnsAResolver in the join-address resolver chain, which
      # returns every replica's pod IP.
      - contains:
          path: spec.template.spec.containers[1].args
          content: --cluster.join-addresses=RELEASE-NAME-cz-server-cluster.NAMESPACE.svc.cluster.local:9090
        template: templates/agent-deploy.yaml

  # Test Alloy volume mounts
  - it: should mount Alloy config from ConfigMap
    set:
      components.agent.mode: clustered
    asserts:
      - contains:
          path: spec.template.spec.containers[1].volumeMounts
          content:
            name: config-volume
            mountPath: /etc/alloy
            readOnly: true
        template: templates/agent-deploy.yaml

  # Test that /tmp is mounted as an emptyDir in the Alloy container
  # The agent image is distroless/scratch and has no /tmp directory; the Alloy
  # process requires a writable /tmp to create its storage path (/tmp/alloy).
  # Without this mount, the container crashes immediately with:
  #   Error: failed to create the remotecfg service: mkdir /tmp: permission denied
  - it: should mount an emptyDir at /tmp in the Alloy container
    set:
      components.agent.mode: clustered
    asserts:
      - contains:
          path: spec.template.spec.containers[1].volumeMounts
          content:
            name: alloy-tmp
            mountPath: /tmp
        template: templates/agent-deploy.yaml
      - contains:
          path: spec.template.spec.volumes
          content:
            name: alloy-tmp
            emptyDir: {}
        template: templates/agent-deploy.yaml

  # Verify alloy-tmp volume is NOT created in non-clustered modes
  - it: should not create alloy-tmp volume when not in clustered mode
    set:
      components.agent.mode: agent
    asserts:
      - notContains:
          path: spec.template.spec.volumes
          content:
            name: alloy-tmp
            emptyDir: {}
        template: templates/agent-deploy.yaml

  # Test Alloy environment variables
  - it: should set HOSTNAME environment variable for Alloy
    set:
      components.agent.mode: clustered
    asserts:
      - contains:
          path: spec.template.spec.containers[1].env
          content:
            name: HOSTNAME
            valueFrom:
              fieldRef:
                fieldPath: metadata.name
        template: templates/agent-deploy.yaml

  # Test Alloy probes
  - it: should configure Alloy readiness and liveness probes
    set:
      components.agent.mode: clustered
    asserts:
      - equal:
          path: spec.template.spec.containers[1].readinessProbe.httpGet.path
          value: /-/ready
        template: templates/agent-deploy.yaml
      - equal:
          path: spec.template.spec.containers[1].readinessProbe.httpGet.port
          value: 9090
        template: templates/agent-deploy.yaml
      - equal:
          path: spec.template.spec.containers[1].livenessProbe.httpGet.path
          value: /-/healthy
        template: templates/agent-deploy.yaml
      - equal:
          path: spec.template.spec.containers[1].livenessProbe.httpGet.port
          value: 9090
        template: templates/agent-deploy.yaml

  # The ring identity must not come from .Values.clusterName: that value is the
  # CloudZero cost-attribution identifier, is optional, and defaults to empty,
  # so a ring keyed on it would label most installations with nothing. Deriving
  # it from the server resource name keeps it release-scoped and always present.
  - it: should derive the cluster name from the server resource name
    set:
      components.agent.mode: clustered
      clusterName: ""
    asserts:
      - contains:
          path: spec.template.spec.containers[1].args
          content: --cluster.name=RELEASE-NAME-cz-server
        template: templates/agent-deploy.yaml
