suite: test aggregator/collector accepts KubeState label & annotation metrics
templates:
  - templates/aggregator-cm.yaml
tests:
  # The aggregator's collector applies its own cost-metric filter
  # (metricFilters.cost), separate from Alloy's metric_allowlist. For KubeState
  # label/annotation collection to reach CloudZero, the collector must accept the
  # kube_<resource>_labels / kube_<resource>_annotations metrics and keep the
  # annotation_ label dimension prefix.

  - it: should accept kube_<resource>_labels metrics in the cost filter
    template: templates/aggregator-cm.yaml
    set:
      components.agent.mode: clustered
    asserts:
      - matchRegex:
          path: data["config.yml"]
          pattern: 'pattern: "kube_pod_labels"'
      - matchRegex:
          path: data["config.yml"]
          pattern: 'pattern: "kube_namespace_labels"'
      - matchRegex:
          path: data["config.yml"]
          pattern: 'pattern: "kube_node_labels"'

  - it: should accept kube_<resource>_annotations metrics in the cost filter
    template: templates/aggregator-cm.yaml
    set:
      components.agent.mode: clustered
    asserts:
      - matchRegex:
          path: data["config.yml"]
          pattern: 'pattern: "kube_pod_annotations"'
      - matchRegex:
          path: data["config.yml"]
          pattern: 'pattern: "kube_namespace_annotations"'
      - matchRegex:
          path: data["config.yml"]
          pattern: 'pattern: "kube_node_annotations"'

  - it: should keep the annotation_ label dimension prefix in cost_labels
    template: templates/aggregator-cm.yaml
    set:
      components.agent.mode: clustered
    asserts:
      - matchRegex:
          path: data["config.yml"]
          pattern: 'pattern: "annotation_"'

  # Workload label/annotation metrics are only emitted by the KubeState plugin,
  # so the collector accepts them only when kubeState is enabled (leaving the
  # default aggregator config unchanged).
  # Assertions are scoped to one filter block: only "- pattern/match" entries may
  # sit between the block's key and the expected entry, so a hit in another
  # filter (e.g. observability) cannot satisfy them.
  - it: should accept kube_<workload>_labels/annotations metrics when kubeState is enabled
    template: templates/aggregator-cm.yaml
    set:
      components.agent.mode: clustered
      components.agent.kubeState.enabled: true
      kubeStateMetrics.enabled: false
    asserts:
      - matchRegex:
          path: data["config.yml"]
          pattern: 'cost:(\s+- pattern: "[^"]*"\s+match: \w+)*\s+- pattern: "kube_deployment_labels"'
      - matchRegex:
          path: data["config.yml"]
          pattern: 'cost:(\s+- pattern: "[^"]*"\s+match: \w+)*\s+- pattern: "kube_statefulset_labels"'
      - matchRegex:
          path: data["config.yml"]
          pattern: 'cost:(\s+- pattern: "[^"]*"\s+match: \w+)*\s+- pattern: "kube_daemonset_labels"'
      - matchRegex:
          path: data["config.yml"]
          pattern: 'cost:(\s+- pattern: "[^"]*"\s+match: \w+)*\s+- pattern: "kube_job_labels"'
      - matchRegex:
          path: data["config.yml"]
          pattern: 'cost:(\s+- pattern: "[^"]*"\s+match: \w+)*\s+- pattern: "kube_cronjob_annotations"'

  # The collector rebuilds each cost metric's labels from cost_labels only, so
  # the plugin's workload name labels must be listed there too or workload
  # series arrive without identifying their object.
  - it: should keep workload name labels in cost_labels when kubeState is enabled
    template: templates/aggregator-cm.yaml
    set:
      components.agent.mode: clustered
      components.agent.kubeState.enabled: true
      kubeStateMetrics.enabled: false
    asserts:
      - matchRegex:
          path: data["config.yml"]
          pattern: 'cost_labels:(\s+- pattern: "[^"]*"\s+match: \w+)*\s+- pattern: "deployment"'
      - matchRegex:
          path: data["config.yml"]
          pattern: 'cost_labels:(\s+- pattern: "[^"]*"\s+match: \w+)*\s+- pattern: "statefulset"'
      - matchRegex:
          path: data["config.yml"]
          pattern: 'cost_labels:(\s+- pattern: "[^"]*"\s+match: \w+)*\s+- pattern: "daemonset"'
      - matchRegex:
          path: data["config.yml"]
          pattern: 'cost_labels:(\s+- pattern: "[^"]*"\s+match: \w+)*\s+- pattern: "job_name"'
      - matchRegex:
          path: data["config.yml"]
          pattern: 'cost_labels:(\s+- pattern: "[^"]*"\s+match: \w+)*\s+- pattern: "cronjob"'

  - it: should not accept kube_<workload>_labels/annotations metrics when kubeState is disabled
    template: templates/aggregator-cm.yaml
    set:
      components.agent.mode: clustered
    asserts:
      - notMatchRegex:
          path: data["config.yml"]
          pattern: "kube_(deployment|statefulset|daemonset|job|cronjob)_(labels|annotations)"
      - notMatchRegex:
          path: data["config.yml"]
          pattern: 'pattern: "(deployment|statefulset|daemonset|job_name|cronjob)"'
